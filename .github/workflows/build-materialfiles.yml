name: Build MaterialFiles

on:
  push:
    branches:
      - dev
      - master

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      TZ: Asia/Shanghai

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "${{ github.workspace }}/release.jks"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build signed release APK
        env:
          STORE_FILE: ${{ github.workspace }}/release.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Copy release APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/Files-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Files-release
          path: out/Files-release.apk
          retention-days: 10